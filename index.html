<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homework Note</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F2F7; --card:#FFFFFF;
  --sheet:#F2F2F7; --cell:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.18);
  --tint:#5856D6; --red:#FF3B30; --green:#34C759;
  --material:rgba(250,250,252,.82);
  --dim:rgba(0,0,0,.32);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1C1C1E;
    --sheet:#1C1C1E; --cell:#2C2C2E;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
    --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55);
    --tint:#7D7AFF; --red:#FF453A; --green:#30D158;
    --material:rgba(44,44,46,.82);
    --dim:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.29;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 60%,transparent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Home ---------- */
.app{max-width:600px;margin:0 auto;padding:calc(var(--st) + 18px) calc(var(--sr) + 16px) calc(var(--sb) + 28px) calc(var(--sl) + 16px)}
.today-line{font-size:13px;font-weight:600;color:var(--label2);margin:0 4px 2px;text-transform:none;letter-spacing:0}
.large-title{font-family:var(--display);font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em;margin:0 4px 14px}
.banner{font-size:13px;color:var(--label2);background:var(--fill);border-radius:10px;padding:8px 12px;margin:0 0 12px}

.cal{background:var(--card);border-radius:16px;padding:12px 8px 8px;overflow:hidden;touch-action:pan-y}
.cal-head{display:flex;align-items:center;gap:4px;padding:0 6px 10px}
.month{font-size:20px;font-weight:700;letter-spacing:.02em;flex:1;margin:0}
.month span{color:var(--tint)}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--tint)}
.icon-btn:active{background:var(--fill)}
.icon-btn svg{width:20px;height:20px}
.pill{font-size:15px;font-weight:600;color:var(--tint);background:color-mix(in srgb,var(--tint) 14%,transparent);padding:6px 12px;border-radius:999px;margin-right:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:600;color:var(--label2);text-align:center;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:.5px solid var(--sep);will-change:transform}
.cal{-webkit-user-select:none;user-select:none}
.day{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:clamp(62px,15vw,92px);padding:4px 2px 4px;border-bottom:.5px solid var(--sep);text-align:left;position:relative;transition:background .15s}
.day:active{background:var(--fill)}
.day:nth-last-child(-n+7){border-bottom:0}
.day.other .num{color:var(--label3)}
.day.other .chip{opacity:.45}
.num{align-self:center;font-size:15px;font-weight:500;width:28px;height:28px;line-height:28px;text-align:center;border-radius:14px;font-variant-numeric:tabular-nums;flex:none}
.day.weekend:not(.other) .num{color:var(--label2)}
.day.today .num{background:var(--tint);color:#fff;font-weight:700}
.day.sel:not(.today) .num{background:var(--label);color:var(--bg);font-weight:700}
.chip{--c:var(--tint);display:flex;align-items:center;gap:2px;font-size:10.5px;line-height:15px;font-weight:600;padding:0 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 62%,var(--label));
  }
.chip .t{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.chip .d{flex:none;font-size:9.5px;font-weight:800;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 30%,transparent);border-radius:3px;padding:0 3px;line-height:13px}
.chip.task::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;border:1.3px solid currentColor;margin-right:1px;flex:none}
.chip.done{text-decoration:line-through;opacity:.55}
.chip.done::before{background:currentColor}
.more{font-size:10px;font-weight:600;color:var(--label2);padding-left:4px;line-height:13px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:14px;font-size:17px;font-weight:600;transition:transform .12s, filter .12s}
.big-btn svg{width:22px;height:22px;flex:none}
.big-btn:active{transform:scale(.97);filter:brightness(.92)}
.big-btn.filled{background:var(--tint);color:#fff}
.big-btn.tinted{background:color-mix(in srgb,var(--tint) 15%,transparent);color:var(--tint)}
.list-btn{grid-column:1/-1;background:var(--card);color:var(--label);justify-content:flex-start;padding:0 16px}
.list-btn svg{color:var(--tint)}
.list-btn .count{margin-left:auto;min-width:28px;height:28px;padding:0 9px;border-radius:14px;background:var(--tint);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.title-row{display:flex;align-items:center;gap:12px;margin:0 4px 14px}
.title-row .large-title{margin:0;flex:1}
.acct{width:38px;height:38px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--card);color:var(--tint);flex:none;font-weight:600;font-size:16px;transition:transform .15s}
.acct:active{transform:scale(.92)}
.acct img{width:100%;height:100%;object-fit:cover;display:block}
.acct svg{width:24px;height:24px}
.foot button{color:var(--tint);font-weight:500}
.foot{font-size:13px;color:var(--label2);text-align:center;margin:14px 0 0}

/* ---------- Layers & sheets ---------- */
.layer{position:fixed;inset:0;z-index:10}
.backdrop{position:absolute;inset:0;background:var(--dim);opacity:0;transition:opacity .35s ease}
.layer.in .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;background:var(--sheet);border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:0 -4px 30px rgba(0,0,0,.12);will-change:transform}
.layer.in .sheet{transform:none}
.sheet.day-sheet{height:62%;transition:transform .5s var(--spring),height .45s var(--spring)}
.sheet.day-sheet.large{border-radius:12px 12px 0 0}
.sheet.page{top:calc(var(--st) + 12px)}
.grabber{display:block;width:60px;height:20px;margin:0 auto -6px;flex:none;position:relative;touch-action:none;cursor:grab}
.grabber::before{content:"";position:absolute;left:12px;right:12px;top:6px;height:5px;border-radius:3px;background:var(--label3)}
.sa-probe{position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.sheet-top{padding:4px 16px 8px calc(16px + var(--sl));display:flex;align-items:flex-start;gap:12px;flex:none;touch-action:none;cursor:grab}
.sheet-top h2{margin:0;font-family:var(--display);font-size:28px;line-height:34px;font-weight:700;letter-spacing:.01em}
.sheet-top p{margin:0;font-size:15px;color:var(--label2);font-weight:500}
.close{margin-left:auto;width:30px;height:30px;border-radius:15px;background:var(--fill);display:grid;place-items:center;color:var(--label2);flex:none;margin-top:4px}
.close svg{width:12px;height:12px}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--sb) + 24px);flex:1;overscroll-behavior:contain}

.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding:0 16px;flex:none;border-bottom:.5px solid transparent}
.nav h2{margin:0;font-size:17px;font-weight:600}
.nav-btn{color:var(--tint);font-size:17px;justify-self:start;padding:8px 0}
.nav-btn.strong{font-weight:600;justify-self:end}
.nav-btn:disabled{color:var(--label3);cursor:default}

.group-h{font-size:13px;font-weight:400;color:var(--label2);margin:22px 16px 7px;letter-spacing:0}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.group + .group{margin-top:22px}
.group-foot{font-size:13px;color:var(--label2);margin:7px 16px 0}
.group-foot.warn{color:var(--red)}
.cell{display:flex;align-items:center;min-height:46px;padding:0 16px;position:relative;gap:12px}
.cell + .cell::before,.dp + .cell::before,.att-list > .cell::before,.att-list:not(:empty) + .cell::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.att-list > .cell:first-child::before{display:none}
.cell input[type=text],.cell input[type=url],.cell input:not([type]),.cell textarea{flex:1;border:0;background:none;outline:none;padding:12px 0;min-width:0}
.cell input::placeholder,.cell textarea::placeholder{color:var(--label3)}
.cell textarea{resize:none;line-height:1.35;min-height:84px}
.title-in{font-size:20px;font-weight:600}
.kv-row{justify-content:space-between;cursor:pointer}
.kv-row{cursor:default}
.date-btn{background:var(--fill);border-radius:7px;padding:6px 11px;font-size:16px;color:var(--label);font-variant-numeric:tabular-nums;transition:color .2s}
.date-btn.active{color:var(--tint)}
.dp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--spring)}
.dp.open{grid-template-rows:1fr}
.dp-inner{overflow:hidden;min-height:0;padding:0 12px}
.dp.open .dp-inner{padding-bottom:10px}
.dp-head{display:flex;align-items:center;gap:2px;padding:4px 0 6px 4px}
.dp-title{flex:1;font-size:17px;font-weight:600}
.dp-wk,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dp-wk{font-size:13px;font-weight:600;color:var(--label3);padding-bottom:2px}
.dp-day{height:42px;font-size:19px;font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative}
.dp-day::before{content:"";position:absolute;width:40px;height:40px;border-radius:50%;z-index:-1;transition:background .2s,transform .2s var(--spring);transform:scale(.6)}
.dp-day{z-index:0}
.dp-day.today{color:var(--tint)}
.dp-day.sel{color:var(--tint);font-weight:700}
.dp-day.sel::before{background:color-mix(in srgb,var(--tint) 16%,transparent);transform:none}
.dp-day.today.sel{color:#fff}
.dp-day.today.sel::before{background:var(--tint)}
.dp-day:active::before{background:var(--fill);transform:none}
.colors{gap:0;justify-content:space-between;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;row-gap:10px}
.swatch{width:30px;height:30px;border-radius:50%;background:var(--c);position:relative;transition:transform .15s var(--spring)}
.swatch[aria-checked=true]{box-shadow:0 0 0 2.5px var(--cell),0 0 0 4.5px var(--c);transform:scale(.88)}
.swatch:active{transform:scale(.8)}
.row-btn{color:var(--tint);width:100%;text-align:left;cursor:pointer}
.row-btn svg{width:22px;height:22px;flex:none}
.link-row input{padding:12px 0}
.link-row button{color:var(--tint);font-weight:600}
.att{min-height:58px}
.att .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--fill);flex:none;display:grid;place-items:center;color:var(--label2);overflow:hidden}
.att .thumb svg{width:22px;height:22px}
.att .meta{flex:1;min-width:0}
.att .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.att .kind{font-size:13px;color:var(--label2)}
.att .rm{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:var(--red)}
.att .rm svg{width:22px;height:22px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--fill2);border-top-color:var(--label2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Day list ---------- */
.list{background:var(--cell);border-radius:12px;overflow:hidden}
.item{position:relative}
.item + .item::before{content:"";position:absolute;top:0;right:0;left:34px;border-top:.5px solid var(--sep);z-index:1}
.item-head{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 11px 14px;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .2s, transform .25s var(--spring);background:var(--cell)}
.item-head:active{background:var(--fill)}
.item-head.pressing{transform:scale(.975);background:var(--fill)}
.mark{--c:var(--tint);width:8px;align-self:stretch;border-radius:4px;background:var(--c);flex:none;min-height:36px}
.item.task .mark,.item.todo .mark{width:8px;background:none;border:2px solid var(--c)}
.item.task.done .mark,.item.todo.done .mark{background:var(--c)}
.item-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item-title{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.done .item-title{text-decoration:line-through;color:var(--label2)}
.item-sub{font-size:13px;color:var(--label2)}
.chev{width:14px;height:14px;color:var(--label3);transition:transform .3s var(--spring);flex:none}
.item.open .chev{transform:rotate(90deg)}
.item-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--spring)}
.item.open .item-body{grid-template-rows:1fr}
.item-inner{overflow:hidden;min-height:0}
.detail{padding:2px 16px 16px 34px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.kv div{background:var(--fill);border-radius:10px;padding:8px 10px}
.kv dt{font-size:12px;color:var(--label2);font-weight:500}
.kv dd{margin:2px 0 0;font-size:15px;font-weight:600}
.d-block h4{margin:0 0 3px;font-size:13px;font-weight:600;color:var(--label2)}
.d-block p{margin:0;font-size:16px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}
.d-empty{font-size:15px;color:var(--label3)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.media button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--fill);position:relative}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.media .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.media .play svg{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--fill);color:var(--label);text-decoration:none;min-width:0}
.file svg{width:22px;height:22px;color:var(--tint);flex:none}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.file small{color:var(--label2);font-size:13px;flex:none}
.done-btn{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--tint);background:color-mix(in srgb,var(--tint) 14%,transparent);padding:8px 14px;border-radius:999px}
.done-btn svg{width:18px;height:18px}
.done-btn.on{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.hint{font-size:13px;color:var(--label2);margin:8px 16px 0}
.empty{text-align:center;padding:34px 20px 26px;color:var(--label2)}
.empty svg{width:44px;height:44px;color:var(--label3);margin-bottom:8px}
.empty h3{margin:0 0 4px;color:var(--label);font-size:20px;font-weight:600}
.empty p{margin:0;font-size:15px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.sheet-actions.one{grid-template-columns:1fr}
.sheet-actions .big-btn{height:50px;font-size:16px}

/* ---------- Urgency, segmented control, switch ---------- */
.urg{--u:#30B0C7;font-size:12px;font-weight:600;line-height:18px;padding:1px 9px;border-radius:999px;flex:none;
  background:color-mix(in srgb,var(--u) 16%,transparent);color:color-mix(in srgb,var(--u) 62%,var(--label))}
.urg.u1{--u:#FF9500}.urg.u2{--u:#FF3B30}
.g-urgent{color:var(--red)}
.seg{display:flex;flex:1;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:8px 0}
.seg button{flex:1;height:32px;border-radius:7px;font-size:15px;font-weight:500;transition:background .2s,box-shadow .2s}
.seg button[aria-checked=true]{background:var(--cell);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){.seg button[aria-checked=true]{background:#636366}}
.seg button[data-urg="0"][aria-checked=true]{color:#1E8FA6}.seg button[data-urg="1"][aria-checked=true]{color:#E08600}.seg button[data-urg="2"][aria-checked=true]{color:#F0281D}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.28);transition:transform .3s var(--spring)}
.switch[aria-checked=true]{background:var(--green)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.slider{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;margin:0;background:transparent;cursor:pointer;--p:44%}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--tint) var(--p),var(--fill2) var(--p))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.28);margin-top:-12px}
.slider::-moz-range-track{height:4px;border-radius:2px;background:var(--fill2)}
.slider::-moz-range-progress{height:4px;border-radius:2px;background:var(--tint)}
.slider::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.28)}
.diff-val{min-width:4.5ch;text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tint)}
.diff-val.unset{color:var(--label3);font-weight:400}
.team-panel .dp-inner{padding:0 16px}
.team-panel.open .dp-inner{border-top:.5px solid var(--sep);padding-top:10px;padding-bottom:12px}
.members{width:100%;display:block;border:0;outline:0;resize:none;background:var(--fill);border-radius:10px;padding:10px 12px;line-height:1.35;font-size:16px}
.members::placeholder{color:var(--label3)}
.rise-note{font-size:13px;color:var(--label2);margin:0}
.done-toggle{display:flex;align-items:center;gap:6px;margin:22px 16px 7px;font-size:13px;color:var(--label2)}
.done-toggle .chev{width:12px;height:12px;transition:transform .3s var(--spring)}
.done-toggle[aria-expanded=true] .chev{transform:rotate(90deg)}

/* ---------- Account ---------- */
.sheet.acct-sheet{max-height:calc(100% - var(--st) - 40px)}
.acct-intro{text-align:center;padding:14px 16px 6px}
.acct-intro .big-ico{width:56px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint);display:grid;place-items:center;margin:0 auto 12px}
.acct-intro .big-ico svg{width:30px;height:30px}
.acct-intro h3{margin:0 0 6px;font-size:20px;font-weight:600}
.acct-intro p{margin:0 auto;font-size:15px;color:var(--label2);max-width:34ch;line-height:1.4}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;margin-top:20px;border-radius:999px;background:#fff;color:#1F1F1F;border:1px solid #747775;font-size:16px;font-weight:500;transition:background .15s,transform .12s}
.g-btn:active{background:#f1f3f4;transform:scale(.98)}
.g-btn:disabled{opacity:.6;cursor:default}
.g-btn svg{width:20px;height:20px;flex:none}
@media (prefers-color-scheme: dark){.g-btn{background:#131314;color:#E3E3E3;border-color:#8E918F}.g-btn:active{background:#1f1f20}}
.acct-err{color:var(--red);font-size:14px;text-align:center;margin:12px 4px 0}
.profile{display:flex;align-items:center;gap:14px;padding:6px 4px 18px}
.profile .av{width:56px;height:56px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:600;overflow:hidden;flex:none}
.profile .av img{width:100%;height:100%;object-fit:cover}
.profile b{display:block;font-size:20px;font-weight:600}
.profile span{font-size:15px;color:var(--label2);overflow-wrap:anywhere}
.cell .val{margin-left:auto;color:var(--label2)}
.cell.destructive-row{color:var(--red);justify-content:center;font-size:17px;width:100%}
.media .missing::after{content:"On another device";position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;padding:6px;color:var(--label2);line-height:1.25}
.file.missing{opacity:.6}

/* ---------- Context menu ---------- */
.ctx .backdrop{background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
@media (prefers-color-scheme: dark){.ctx .backdrop{background:rgba(0,0,0,.4)}}
.lift{position:fixed;border-radius:13px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);transition:transform .35s var(--spring);transform:scale(1);pointer-events:none}
.ctx.in .lift{transform:scale(1.04)}
.lift .item-head{background:var(--cell)}
.menu{position:fixed;width:250px;background:var(--material);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border-radius:13px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.2);
  transform:scale(.6);opacity:0;transform-origin:top left;transition:transform .35s var(--spring),opacity .2s}
.ctx.in .menu{transform:none;opacity:1}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;font-size:17px;text-align:left}
.menu button + button{border-top:.5px solid var(--sep)}
.menu button:active{background:var(--fill)}
.menu svg{width:20px;height:20px}
.menu .destructive{color:var(--red)}

/* ---------- Action sheet ---------- */
.as{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;padding:0 10px calc(var(--sb) + 10px);transform:translateY(110%);transition:transform .45s var(--spring)}
.layer.in .as{transform:none}
.as-group{background:var(--material);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border-radius:14px;overflow:hidden}
.as-title{padding:14px 20px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep)}
.as-title b{display:block;font-weight:600;margin-bottom:2px}
.as-btn{display:block;width:100%;height:57px;font-size:20px;color:var(--tint);text-align:center}
.as-btn + .as-btn{border-top:.5px solid var(--sep)}
.as-btn.red{color:var(--red)}
.as-btn.cancel{margin-top:8px;background:var(--cell);border-radius:14px;font-weight:600}
.as-btn:active{background:var(--fill)}

/* ---------- Viewer ---------- */
.viewer{background:#000;opacity:0;transition:opacity .25s}
.viewer.in{opacity:1}
.viewer img,.viewer video{position:absolute;inset:calc(var(--st) + 56px) 0 calc(var(--sb) + 20px);margin:auto;max-width:100%;max-height:calc(100% - var(--st) - var(--sb) - 76px);object-fit:contain}
.viewer .close{position:absolute;top:calc(var(--st) + 12px);right:16px;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:17px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 28px);transform:translate(-50%,20px) scale(.9);opacity:0;z-index:100;background:var(--material);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:transform .4s var(--spring),opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.toast svg{width:20px;height:20px;color:var(--green)}
.toast.err svg{color:var(--red)}

@media (min-width:520px){ .chip{font-size:11.5px;line-height:17px} }
@media (min-width:700px){ .app{max-width:760px} .day{min-height:104px} .chip{font-size:12.5px;line-height:19px} .large-title{font-size:40px;line-height:48px} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<body>
<main class="app">
  <p class="today-line" id="todayLine"></p>
  <div class="title-row">
    <h1 class="large-title">Homework Note</h1>
    <button class="acct" id="acctBtn" aria-label="Account"></button>
  </div>
  <p class="banner" id="banner" hidden></p>

  <section class="cal" aria-label="Calendar">
    <div class="cal-head">
      <h2 class="month" id="monthLabel" aria-live="polite"></h2>
      <button class="pill" id="todayBtn" hidden>Today</button>
      <button class="icon-btn" id="prevBtn" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon-btn" id="nextBtn" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="wk" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="actions">
    <button class="big-btn filled" data-add="event">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>
      Add event
    </button>
    <button class="big-btn tinted" data-add="task">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.8 1.8L9 5M4 13.5l1.8 1.8L9 12M12.5 7h7.5M12.5 14h7.5M4.5 19.5h.01M12.5 20h7.5"/></svg>
      Add task
    </button>
    <button class="big-btn list-btn" id="todoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.5"/></svg>
      To do list
      <span class="count" id="todoCount" hidden></span>
    </button>
  </div>
  <p class="foot" id="foot" hidden></p>
</main>
<script src="firebase-config.js"></script>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ===================== Utilities ===================== */
const LOC = "en-US-u-ca-gregory-nu-latn"; // always Gregorian years (2026, not 2569)
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => toKey(new Date());
const fmt = (k, o) => fromKey(k).toLocaleDateString(LOC, o);
const short = k => k ? fmt(k, { weekday: "short", month: "short", day: "numeric" }) : "Not set";
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MAX_BYTES = 20 * 1024 * 1024;

const COLORS = [
  ["Red", "#FF3B30"], ["Orange", "#FF9500"], ["Yellow", "#FFCC00"], ["Green", "#34C759"], ["Teal", "#30B0C7"],
  ["Blue", "#007AFF"], ["Indigo", "#5856D6"], ["Purple", "#AF52DE"], ["Pink", "#FF2D55"], ["Brown", "#A2845E"]
];

const I = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8.5 8.5"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5z"/><path d="M14 3v5.5h5.5M8.5 13h7M8.5 16.5h5"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>',
  minus: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7.5 12h9" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M9.5 6.5V4.5h5v2M6 6.5l1 13a1.5 1.5 0 0 0 1.5 1.4h7a1.5 1.5 0 0 0 1.5-1.4l1-13M10 10.5v6.5M14 10.5v6.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkCircle: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v6M12 16.5v.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
  circle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>',
  calEmpty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
};

/* ===================== Local storage helpers ===================== */
const LS_LOCAL = "homework-note.local.v1";   // items saved on this device while signed out
const LS_CACHE = "homework-note.cache.v1";   // per-account copy of synced items, for instant start
const LS_UID = "homework-note.uid.v1";       // the account last signed in on this device
const cacheKey = uid => `${LS_CACHE}.${uid}`;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

const idb = {
  p: null,
  open() {
    return this.p ||= new Promise((res, rej) => {
      const r = indexedDB.open("homework-note", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction("files", mode);
      const req = fn(t.objectStore("files"));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  },
  put(k, v) { return this.run("readwrite", s => s.put(v, k)); },
  get(k) { return this.run("readonly", s => s.get(k)); },
  del(k) { return this.run("readwrite", s => s.delete(k)); }
};
const localUrls = {};
async function localUrl(id) {
  if (localUrls[id]) return localUrls[id];
  try { const b = await idb.get(id); if (b) return (localUrls[id] = URL.createObjectURL(b)); } catch {}
  return "";
}
function attUrl(a) {
  if (a.url) return a.url;
  if (a.assetId) return "/_blob/" + a.assetId;
  if (a.localId && localUrls[a.localId]) return localUrls[a.localId];
  return "";
}
async function hydrate(root) {
  for (const el of root.querySelectorAll("[data-local]")) {
    const u = await localUrl(el.dataset.local);
    if (!u) { const host = el.closest("button, a"); if (host) host.classList.add("missing"); continue; }
    if (el.tagName === "A") el.href = u; else el.src = u;
  }
}

/* ===================== State & store ===================== */
const cloud = { state: "off", user: null, pendingUid: lsGet(LS_UID), Au: null, F: null, auth: null, db: null, unsub: null };

const S = {
  items: (cloud.pendingUid && lsGet(cacheKey(cloud.pendingUid))) || lsGet(LS_LOCAL) || [],
  y: new Date().getFullYear(),
  m: new Date().getMonth(),
  selected: null,
  expanded: new Set(),
  mode: "starting"
};

const store = {
  col: null,
  upsertLocal(item) {
    const i = S.items.findIndex(x => x.id === item.id);
    if (i >= 0) S.items[i] = item; else S.items.push(item);
  },
  /* Account writes don't wait for the server, so saving also works offline; they sync when back online. */
  write(fn) {
    Promise.resolve().then(fn).catch(e => {
      console.warn(e);
      toast(e && e.code === "resource-exhausted" ? "Your account storage is full." : "Couldn't save to your account. Check your connection.", true);
    });
  },
  saveCopy() {
    const uid = cloud.user ? cloud.user.uid : cloud.pendingUid;
    if (uid) lsSet(cacheKey(uid), S.items); else lsSet(LS_LOCAL, S.items);
  },
  async put(item) {
    item = JSON.parse(JSON.stringify(item));
    this.upsertLocal(item);
    refresh();
    if (this.col) this.write(() => this.col.doc(item.id).set(item));
    this.saveCopy();
  },
  async remove(item) {
    S.items = S.items.filter(x => x.id !== item.id);
    S.expanded.delete(item.id);
    refresh();
    if (this.col) this.write(() => this.col.doc(item.id).delete());
    this.saveCopy();
    for (const a of item.attachments || []) this.dropFile(a);
  },
  /* Photos, videos and PDFs are kept on the device where they were added */
  async upload(file) {
    const localId = newId();
    await idb.put(localId, file);
    localUrls[localId] = URL.createObjectURL(file);
    return { localId };
  },
  async dropFile(a) { try { if (a.localId) await idb.del(a.localId); } catch {} }
};

/* ===================== Account: Google sign-in + sync (Firebase) ===================== */
const FB_VERSION = "10.14.1";

async function boot() {
  updateFoot(); updateAccountUI();
  const cfg = window.HN_FIREBASE;
  if (!cfg || !cfg.apiKey) return;            // sign-in not set up: everything stays on this device
  cloud.state = "loading";
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [A, Au, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const app = A.initializeApp(cfg);
    cloud.Au = Au; cloud.F = F; cloud.auth = Au.getAuth(app);
    try { cloud.db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch { cloud.db = F.getFirestore(app); }
    cloud.state = "ready";
    Au.onAuthStateChanged(cloud.auth, onAuth);
  } catch (e) {
    console.warn(e);
    cloud.state = "failed";
    if (cloud.pendingUid) showBanner("You're offline. Changes you make now won't sync to your account.");
    updateFoot(); updateAccountUI();
  }
}

function showBanner(msg) { const b = $("#banner"); if (msg) { b.textContent = msg; b.hidden = false; } else b.hidden = true; }

function onAuth(user) {
  if (cloud.unsub) { cloud.unsub(); cloud.unsub = null; }
  cloud.user = user;
  if (!user) {
    cloud.pendingUid = null; lsDel(LS_UID);
    store.col = null; S.mode = "local"; S.expanded.clear();
    S.items = lsGet(LS_LOCAL) || [];
    showBanner(null);
  } else startSync(user);
  refresh(); updateFoot(); updateAccountUI();
}

function startSync(user) {
  const uid = user.uid, F = cloud.F;
  cloud.pendingUid = uid; lsSet(LS_UID, uid);
  S.mode = "cloud";
  S.items = lsGet(cacheKey(uid)) || [];
  const col = F.collection(cloud.db, "users", uid, "items");
  store.col = { doc: id => ({ set: d => F.setDoc(F.doc(col, id), d), delete: () => F.deleteDoc(F.doc(col, id)) }) };
  let merged = false;
  const timer = setTimeout(() => showBanner("Your items haven't loaded yet. Showing the copy on this device."), 10000);
  const unsub = F.onSnapshot(col, { includeMetadataChanges: true }, snap => {
    S.items = snap.docs.map(d => JSON.parse(JSON.stringify(d.data())));
    lsSet(cacheKey(uid), S.items);
    if (!snap.metadata.fromCache) {
      clearTimeout(timer); showBanner(null);
      const local = lsGet(LS_LOCAL);
      if (!merged && local && local.length) {          // first sign-in: bring this device's items into the account
        merged = true;
        const have = new Set(S.items.map(x => x.id));
        const add = local.filter(it => !have.has(it.id));
        Promise.all(add.map(it => F.setDoc(F.doc(col, it.id), it)))
          .then(() => { lsDel(LS_LOCAL); if (add.length) toast(`${add.length} ${add.length === 1 ? "item" : "items"} from this device added to your account`); })
          .catch(e => console.warn(e));
      }
    }
    refresh();
  }, err => {
    clearTimeout(timer);
    console.warn(err);
    showBanner("Your items couldn't be loaded from your account. Check that the Firestore rules in SETUP.md are published.");
  });
  cloud.unsub = () => { clearTimeout(timer); unsub(); };
}

const initial = u => ((u.displayName || u.email || "?").trim()[0] || "?").toUpperCase();
const G_LOGO = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const avatarHtml = u => u.photoURL
  ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${esc(initial(u))}'))">`
  : esc(initial(u));

function updateFoot() {
  const f = $("#foot");
  if (cloud.user) f.innerHTML = `Synced to ${esc(cloud.user.email || "your account")}`;
  else if (window.HN_FIREBASE && window.HN_FIREBASE.apiKey && cloud.state !== "failed") f.innerHTML = `Saved on this device. <button data-open-acct>Sign in to sync</button>`;
  else f.textContent = nativeBridge() ? "Saved on this device." : "Saved in this browser only.";
  f.hidden = false;
}

async function signIn(btn) {
  const { Au, auth } = cloud, err = $("#acctErr");
  const say = m => { if (err) { err.textContent = m; err.hidden = !m; } };
  say(""); btn.disabled = true;
  const provider = new Au.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await Au.signInWithPopup(auth, provider);
    toast("Signed in");
  } catch (e) {
    const c = (e && e.code) || "";
    if (c === "auth/popup-blocked") { try { await Au.signInWithRedirect(auth, provider); return; } catch (e2) { console.warn(e2); } }
    if (c !== "auth/popup-closed-by-user" && c !== "auth/cancelled-popup-request") {
      console.warn(e);
      say(c === "auth/unauthorized-domain" ? "This website isn't approved for sign-in yet. Add it under Authentication, Settings, Authorized domains in Firebase."
        : c === "auth/network-request-failed" ? "Couldn't reach Google. Check your connection and try again."
        : "Couldn't sign in. Try again.");
    }
  } finally { btn.disabled = false; }
}

/* ===================== Calendar ===================== */
function byDue() {
  const map = {};
  for (const it of S.items) if (it.due) (map[it.due] ||= []).push(it);
  for (const k in map) map[k].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  return map;
}

function renderCalendar(dir) {
  const { y, m } = S;
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - first.getDay());
  const days = new Date(y, m + 1, 0).getDate();
  const rows = Math.ceil((first.getDay() + days) / 7);
  const map = byDue();
  const tk = todayKey();
  const maxChips = innerWidth >= 520 ? 3 : 2;

  $("#monthLabel").innerHTML = `${esc(first.toLocaleDateString(LOC, { month: "long" }))} <span>${y}</span>`;
  const now = new Date();
  $("#todayBtn").hidden = (now.getFullYear() === y && now.getMonth() === m);

  let html = "";
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const k = toKey(d);
    const list = map[k] || [];
    const cls = ["day"];
    if (d.getMonth() !== m) cls.push("other");
    if (k === tk) cls.push("today");
    if (k === S.selected) cls.push("sel");
    if (d.getDay() === 0 || d.getDay() === 6) cls.push("weekend");
    const shown = list.slice(0, maxChips);
    const extra = list.length - shown.length;
    const label = `${d.toLocaleDateString(LOC, { weekday: "long", month: "long", day: "numeric" })}, ${list.length ? list.length + (list.length === 1 ? " item" : " items") : "nothing due"}`;
    html += `<button class="${cls.join(" ")}" data-date="${k}" aria-label="${esc(label)}">
      <span class="num">${d.getDate()}</span>
      ${shown.map(it => `<span class="chip ${it.type}${it.done ? " done" : ""}" style="--c:${esc(it.color)}"><span class="t">${esc(it.title)}</span>${it.difficulty != null && it.type !== "event" ? `<span class="d" title="Difficulty ${it.difficulty}">${it.difficulty}</span>` : ""}</span>`).join("")}
      ${extra > 0 ? `<span class="more">+${extra} more</span>` : ""}
    </button>`;
  }
  const g = $("#grid");
  g.innerHTML = html;
}

/* Slide the month grid out and the new month in. `from` is where a swipe left the grid (px). */
let monthAnimating = false;
function shiftMonth(n, from = 0) {
  if (!n || monthAnimating) return;
  const g = $("#grid");
  const go = () => { const d = new Date(S.y, S.m + n, 1); S.y = d.getFullYear(); S.m = d.getMonth(); renderCalendar(); };
  if (reduced) { g.style.transform = ""; g.style.opacity = ""; go(); return; }
  monthAnimating = true;
  const w = g.offsetWidth;
  const out = n > 0 ? -w : w;
  g.style.transition = "none";
  g.style.transform = `translateX(${from}px)`;
  void g.offsetWidth;
  const dur = Math.max(120, 240 * (1 - Math.abs(from) / w));
  g.style.transition = `transform ${dur}ms cubic-bezier(.4,0,1,1), opacity ${dur}ms`;
  g.style.transform = `translateX(${out}px)`;
  g.style.opacity = "0";
  setTimeout(() => {
    go();
    g.style.transition = "none";
    g.style.transform = `translateX(${-out * 0.6}px)`;
    void g.offsetWidth;
    g.style.transition = "transform .45s var(--spring), opacity .3s ease";
    g.style.transform = "";
    g.style.opacity = "";
    setTimeout(() => { monthAnimating = false; }, 120);
  }, dur);
}

/* ===================== Layers ===================== */
let z = 20;
function makeLayer(cls) {
  const el = document.createElement("div");
  el.className = "layer " + (cls || "");
  el.style.zIndex = ++z;
  document.body.appendChild(el);
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  el.close = (cb) => {
    el.classList.remove("in");
    setTimeout(() => {
      el.remove();
      if (!document.querySelector(".layer")) document.body.style.overflow = "";
      cb && cb();
    }, reduced ? 0 : 380);
  };
  return el;
}
function topLayer() { const l = document.querySelectorAll(".layer"); return l[l.length - 1]; }
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const t = topLayer();
  if (t && t.onEscape) t.onEscape();
});

/* ===================== Day sheet ===================== */
let daySheet = null;

const RISE_DAYS = 3, RISE_MS = RISE_DAYS * 86400000;
const URG = [{ name: "Low" }, { name: "Medium" }, { name: "High" }];
const DEFAULT_COLOR = { event: "#5856D6", task: "#FF9500", todo: "#30B0C7" };
const typeName = it => (it.type === "task" ? "task" : it.type === "todo" ? "to-do" : "event");
/* Urgency now = chosen level, plus one level for every RISE_DAYS since it was set, capped at High */
function urgencyOf(it) {
  const base = Math.min(2, Math.max(0, it.urgency | 0));
  if (it.rise === false) return base;
  const start = it.urgencyStart || it.createdAt || Date.now();
  return Math.min(2, base + Math.max(0, Math.floor((Date.now() - start) / RISE_MS)));
}
function riseNote(it) {
  if (it.rise === false) return "";
  const lvl = urgencyOf(it); if (lvl >= 2) return "";
  const start = it.urgencyStart || it.createdAt || Date.now();
  const next = start + (Math.floor((Date.now() - start) / RISE_MS) + 1) * RISE_MS;
  const d = Math.max(1, Math.ceil((next - Date.now()) / 86400000));
  return `Rises to ${URG[lvl + 1].name} in ${d} ${d === 1 ? "day" : "days"}`;
}

function itemSub(it, dayKey) {
  const kind = cap(typeName(it));
  if (it.type === "todo") return it.done ? `${kind}, done` : `${kind}, ${URG[urgencyOf(it)].name.toLowerCase()} urgency`;
  if (it.due === dayKey) {
    if (it.done) return `${kind}, done`;
    return it.assigned && it.assigned !== it.due ? `${kind}, assigned ${short(it.assigned)}` : kind;
  }
  return `${kind}, ${it.done ? "done, " : ""}due ${short(it.due)}`;
}

function attachmentsHtml(atts) {
  const media = atts.filter(a => a.kind === "image" || a.kind === "video");
  const files = atts.filter(a => a.kind === "pdf" || a.kind === "link");
  let h = "";
  if (media.length) {
    h += `<div class="media">${media.map(a => {
      const u = attUrl(a);
      const src = u ? `src="${esc(u)}"` : (a.localId ? `data-local="${esc(a.localId)}"` : "");
      return `<button data-view="${esc(a.id)}" aria-label="Open ${esc(a.name || a.kind)}">${a.kind === "image"
        ? `<img ${src} alt="" loading="lazy">`
        : `<video ${src} muted playsinline preload="metadata"></video><span class="play">${I.play}</span>`}</button>`;
    }).join("")}</div>`;
  }
  if (files.length) {
    h += `<div class="files">${files.map(a => {
      if (a.kind === "link") {
        let host = a.url; try { host = new URL(a.url).hostname.replace(/^www\./, ""); } catch {}
        return `<a class="file" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${I.link}<span>${esc(a.name || host)}</span><small>${esc(host)}</small></a>`;
      }
      const u = attUrl(a);
      const href = u ? `href="${esc(u)}"` : (a.localId ? `data-local="${esc(a.localId)}" href="#"` : `href="#"`);
      return `<a class="file" ${href} target="_blank" rel="noopener">${I.pdf}<span>${esc(a.name || "Document.pdf")}</span><small>PDF</small></a>`;
    }).join("")}</div>`;
  }
  return h;
}

function itemHtml(it, dayKey) {
  const open = S.expanded.has(it.id);
  const atts = it.attachments || [];
  const desc = (it.description || "").trim();
  const ins = (it.instructions || "").trim();
  return `<div class="item ${it.type}${it.done ? " done" : ""}${open ? " open" : ""}" data-id="${esc(it.id)}">
    <button class="item-head" data-press aria-expanded="${open}">
      <span class="mark" style="--c:${esc(it.color)}"></span>
      <span class="item-text"><span class="item-title">${esc(it.title)}</span><span class="item-sub">${esc(itemSub(it, dayKey))}</span></span>
      ${it.type === "todo" && !it.done ? `<span class="urg u${urgencyOf(it)}">${URG[urgencyOf(it)].name}</span>` : ""}
      ${I.chev}
    </button>
    <div class="item-body"><div class="item-inner"><div class="detail">
      <dl class="kv"><div><dt>Assigned</dt><dd>${esc(short(it.assigned))}</dd></div>${it.type === "todo" ? `<div><dt>Urgency</dt><dd>${URG[urgencyOf(it)].name}</dd></div>` : `<div><dt>Due</dt><dd>${esc(short(it.due))}</dd></div>`}${it.type === "event" ? "" : `<div><dt>Difficulty</dt><dd>${it.difficulty != null ? it.difficulty : "Not set"}</dd></div><div><dt>Work</dt><dd>${it.team ? "Team" : "Solo"}</dd></div>`}</dl>
      ${it.team && (it.members || "").trim() ? `<section class="d-block"><h4>Team members</h4><p>${esc(it.members.trim())}</p></section>` : ""}
      ${it.type === "todo" && !it.done && riseNote(it) ? `<p class="rise-note">${esc(riseNote(it))}</p>` : ""}
      <section class="d-block"><h4>Description</h4>${desc ? `<p>${esc(desc)}</p>` : `<p class="d-empty">No description</p>`}</section>
      ${it.type === "task" || it.type === "todo" ? `<section class="d-block"><h4>Instructions</h4>${ins ? `<p>${esc(ins)}</p>` : `<p class="d-empty">No instructions</p>`}</section>` : ""}
      ${atts.length ? `<section class="d-block"><h4>Attachments</h4>${attachmentsHtml(atts)}</section>` : ""}
      <button class="done-btn${it.done ? " on" : ""}" data-done>${it.done ? I.checkCircle + "Done" : I.circle + "Mark as done"}</button>
    </div></div></div>
  </div>`;
}

/* Expand/collapse an item, mark it done, or open an attachment. Shared by the day and to-do sheets. */
function handleItemClick(e) {
  const view = e.target.closest("[data-view]");
  if (view) { const it = findItem(view.closest(".item").dataset.id); const a = it && it.attachments.find(x => x.id === view.dataset.view); if (a) openViewer(a); return true; }
  const mf = e.target.closest(".file.missing");
  if (mf) { e.preventDefault(); toast("This file is on the device where it was added.", true); return true; }
  const done = e.target.closest("[data-done]");
  if (done) { const it = findItem(done.closest(".item").dataset.id); if (it) { const n = { ...it, done: !it.done, updatedAt: Date.now() }; store.put(n).catch(() => {}); if (n.done) toast("Marked as done"); } return true; }
  const head = e.target.closest(".item-head");
  if (head) {
    const item = head.closest(".item"); const id = item.dataset.id;
    const open = !item.classList.contains("open");
    item.classList.toggle("open", open);
    head.setAttribute("aria-expanded", open);
    open ? S.expanded.add(id) : S.expanded.delete(id);
    return true;
  }
  return false;
}
