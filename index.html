let todoSheet = null;
function openTodo() {
  if (todoSheet) return;
  const L = makeLayer("todo");
  L.innerHTML = `<div class="backdrop"></div>
    <div class="sheet day-sheet" role="dialog" aria-modal="true" aria-labelledby="todoTitle">
      <button class="grabber" aria-label="Expand to full screen"></button>
      <div class="sheet-top">
        <div><h2 id="todoTitle">To do list</h2><p id="todoSub"></p></div>
        <button class="close" aria-label="Close">${I.x}</button>
      </div>
      <div class="sheet-scroll"><div class="todo-content"></div></div>
    </div>`;
  const sheet = $(".sheet", L), content = $(".todo-content", L);
  let showDone = false;

  const update = () => {
    const tk = todayKey();
    const open = S.items.filter(i => !i.done);
    const byCreated = (a, b) => (a.createdAt || 0) - (b.createdAt || 0);
    const byDue = (a, b) => (a.due || "").localeCompare(b.due || "") || byCreated(a, b);
    const dated = open.filter(i => i.type !== "todo");
    const overdue = dated.filter(i => i.due < tk).sort(byDue);
    const upcoming = dated.filter(i => i.due >= tk).sort(byDue);
    const todos = [2, 1, 0].map(l => open.filter(i => i.type === "todo" && urgencyOf(i) === l).sort(byCreated));
    const finished = S.items.filter(i => i.done).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const group = (title, list, cls = "") => list.length ? `<h3 class="group-h ${cls}">${title}</h3><div class="list">${list.map(i => itemHtml(i, null)).join("")}</div>` : "";

    $("#todoSub").textContent = open.length ? `${open.length} ${open.length === 1 ? "thing" : "things"} left` : "Nothing left";
    let h = "";
    if (!open.length) h += `<div class="empty">${I.checkCircle.replace("<svg", '<svg style="color:var(--green)"')}<h3>All caught up</h3><p>Add a to-do for anything that has no due date.</p></div>`;
    else {
      h += group("Overdue", overdue, "g-urgent");
      h += group("High urgency", todos[0]) + group("Medium urgency", todos[1]) + group("Low urgency", todos[2]);
      h += group("Coming up", upcoming);
      h += `<p class="hint">Touch and hold an item to edit or delete it.</p>`;
    }
    if (finished.length) {
      h += `<button class="done-toggle" data-toggle-done aria-expanded="${showDone}">${I.chev}Completed (${finished.length})</button>`;
      if (showDone) h += `<div class="list">${finished.map(i => itemHtml(i, null)).join("")}</div>`;
    }
    h += `<div class="sheet-actions one"><button class="big-btn filled" data-add="todo">Add to-do</button></div>`;
    content.innerHTML = h;
    hydrate(content);
  };
  update();

  const close = () => { todoSheet = null; L.close(); };
  L.onEscape = close;
  todoSheet = { update, close };
  L.addEventListener("click", e => {
    if (e.target.classList.contains("backdrop") || e.target.closest(".close")) return close();
    if (e.target.closest("[data-add]")) return openForm("todo", null, null);
    if (e.target.closest("[data-toggle-done]")) { showDone = !showDone; update(); return; }
    handleItemClick(e);
  });
  bindLongPress(content);
  bindDetents(L, sheet, $(".sheet-scroll", L), close);
  setTimeout(() => $(".close", L).focus({ preventScroll: true }), 60);
}

const findItem = id => S.items.find(x => x.id === id);

/* Day sheet detents: half height and full height, like an iOS sheet.
   Swipe up to expand, swipe down to shrink, swipe down again to close. */
let safeTop = null;
function getSafeTop() {
  if (safeTop != null) return safeTop;
  const p = document.createElement("div"); p.className = "sa-probe"; document.body.appendChild(p);
  safeTop = parseFloat(getComputedStyle(p).paddingTop) || 0; p.remove();
  return safeTop;
}
function bindDetents(L, sheet, scroller, close) {
  const grab = $(".grabber", L), top = $(".sheet-top", L);
  let large = false, mediumH = 0, largeH = 0;
  const measure = () => {
    const vh = L.clientHeight;
    largeH = vh - getSafeTop() - 10;
    mediumH = Math.min(Math.round(vh * 0.62), largeH);
  };
  const setDetent = (isLarge) => {
    large = isLarge;
    sheet.classList.toggle("large", large);
    sheet.style.height = (large ? largeH : mediumH) + "px";
    grab.setAttribute("aria-label", large ? "Shrink to half screen" : "Expand to full screen");
  };
  measure(); setDetent(false);
  const onResize = () => { if (!L.isConnected) return removeEventListener("resize", onResize); measure(); setDetent(large); };
  addEventListener("resize", onResize);

  let y0 = null, h0 = 0, claimed = false, fromHandle = false, samples = [], dragged = false;
  const begin = (y, handle) => { y0 = y; h0 = sheet.offsetHeight; claimed = false; dragged = false; fromHandle = handle; samples = [[y, performance.now()]]; };
  const apply = h => {
    if (h > largeH) h = largeH + (h - largeH) * 0.15;              // rubber band past full height
    if (h >= mediumH) { sheet.style.height = h + "px"; sheet.style.transform = "none"; }
    else { sheet.style.height = mediumH + "px"; sheet.style.transform = `translateY(${mediumH - h}px)`; }
  };
  const track = (y, e) => {
    if (y0 == null) return;
    const dy = y - y0;
    if (!claimed) {
      if (Math.abs(dy) < 6) return;
      // Half height: any vertical drag moves the sheet. Full height: only a pull-down
      // from the top of the list (or the handle) does; otherwise the list scrolls.
      if (fromHandle || !large || (dy > 0 && scroller.scrollTop <= 0)) { claimed = true; dragged = true; sheet.style.transition = "none"; }
      else { y0 = null; return; }
    }
    if (e && e.cancelable) e.preventDefault();
    samples.push([y, performance.now()]); if (samples.length > 6) samples.shift();
    apply(h0 - dy);
  };
  // Decide where the sheet ends up after a drag
  const settle = (dyTotal) => {
    const [ya, ta] = samples[0], [yb, tb] = samples[samples.length - 1];
    const v = (yb - ya) / Math.max(1, tb - ta);
    const h = h0 - dyTotal;
    const startedLarge = large;
    sheet.style.transition = "";
    sheet.style.transform = "";
    let target;
    if (v < -0.4) target = "large";
    else if (v > 0.4) target = startedLarge && h > mediumH * 0.8 ? "medium" : "close";
    else if (h > (mediumH + largeH) / 2) target = "large";
    else if (h < mediumH * 0.72) target = "close";
    else target = "medium";
    if (target === "close") { sheet.style.height = mediumH + "px"; close(); }
    else setDetent(target === "large");
    if (navigator.vibrate && target !== (startedLarge ? "large" : "medium")) try { navigator.vibrate(8); } catch {}
  };
  let yStart = 0;
  const end = (y) => {
    if (y0 == null) return;
    const wasClaimed = claimed; const dyTotal = y - yStart; y0 = null;
    if (wasClaimed) settle(dyTotal);
  };

  // Touch
  sheet.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { y0 = null; return; }
    const t = e.touches[0]; yStart = t.clientY;
    begin(t.clientY, !!e.target.closest(".sheet-top, .grabber") && !e.target.closest(".close"));
  }, { passive: true });
  sheet.addEventListener("touchmove", e => { if (e.touches.length === 1) track(e.touches[0].clientY, e); }, { passive: false });
  sheet.addEventListener("touchend", e => end(e.changedTouches[0] ? e.changedTouches[0].clientY : yStart));
  sheet.addEventListener("touchcancel", () => { if (claimed) { y0 = null; sheet.style.transition = ""; sheet.style.transform = ""; setDetent(large); } });
  // Mouse: drag the handle or header
  [grab, top].forEach(h => h.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0 || e.target.closest(".close")) return;
    yStart = e.clientY; begin(e.clientY, true);
  }));
  const pm = e => { if (e.pointerType === "mouse") track(e.clientY, e); };
  const pu = e => { if (e.pointerType === "mouse") end(e.clientY); };
  addEventListener("pointermove", pm); addEventListener("pointerup", pu);
  // Tap the handle to switch between half and full height
  grab.addEventListener("click", () => { if (dragged) { dragged = false; return; } setDetent(!large); });
  // Scrolling the list with a wheel/trackpad while at half height expands it first
  scroller.addEventListener("wheel", e => { if (!large && e.deltaY > 4) setDetent(true); }, { passive: true });
  const origRemove = L.close;
  L.close = cb => { removeEventListener("pointermove", pm); removeEventListener("pointerup", pu); removeEventListener("resize", onResize); origRemove(cb); };
}

/* ===================== Long press → context menu ===================== */
let suppressClick = false;
function bindLongPress(root) {
  let timer = null, x0 = 0, y0 = 0, target = null;
  const cancel = () => { clearTimeout(timer); timer = null; if (target) target.classList.remove("pressing"); target = null; };
  root.addEventListener("pointerdown", e => {
    const h = e.target.closest("[data-press]");
    if (!h || e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; target = h;
    timer = setTimeout(() => {
      const t = target; cancel();
      suppressClick = true;
      if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
      openMenu(t);
    }, 480);
    setTimeout(() => { if (timer && target === h) h.classList.add("pressing"); }, 120);
  });
  root.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => root.addEventListener(ev, cancel));
  root.addEventListener("contextmenu", e => {
    const h = e.target.closest("[data-press]");
    if (!h) return;
    e.preventDefault();
    if (document.querySelector(".ctx")) return;
    cancel(); openMenu(h);
  });
}
// The click that ends a long press must not also toggle the row or close the menu
document.addEventListener("pointerdown", () => { suppressClick = false; }, true);
document.addEventListener("click", e => { if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); } }, true);

function openMenu(head) {
  const id = head.closest(".item").dataset.id;
  const it = findItem(id);
  if (!it || document.querySelector(".ctx")) return;
  const r = head.getBoundingClientRect();
  const L = makeLayer("ctx");
  const type = typeName(it);
  L.innerHTML = `<div class="backdrop"></div><div class="lift"></div>
    <div class="menu" role="menu" aria-label="${esc(it.title)}">
      <button role="menuitem" data-m="edit">Edit ${type}${I.pencil}</button>
      <button role="menuitem" class="destructive" data-m="delete">Delete ${type}${I.trash}</button>
    </div>`;
  const lift = $(".lift", L);
  const clone = head.cloneNode(true);
  clone.classList.remove("pressing");
  lift.appendChild(clone);
  Object.assign(lift.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px" });
  const menu = $(".menu", L);
  const mw = 250, mh = 100;
  const left = Math.min(Math.max(12, r.left + 8), innerWidth - mw - 12);
  const below = r.bottom + 14 + mh < innerHeight - 10;
  menu.style.left = left + "px";
  if (below) { menu.style.top = (r.bottom + 12) + "px"; menu.style.transformOrigin = "top left"; }
  else { menu.style.top = Math.max(12, r.top - mh - 12) + "px"; menu.style.transformOrigin = "bottom left"; }

  const close = () => L.close();
  L.onEscape = close;
  L.addEventListener("click", e => {
    const b = e.target.closest("[data-m]");
    if (!b) return close();
    close();
    if (b.dataset.m === "edit") openForm(it.type, it);
    else confirmDelete(it);
  });
  setTimeout(() => $("[data-m=edit]", L).focus({ preventScroll: true }), 60);
}

async function confirmDelete(it) {
  const type = typeName(it);
  const n = (it.attachments || []).length;
  const ok = await actionSheet({
    title: `Delete “${it.title}”?`,
    message: n ? `Its ${n === 1 ? "attachment" : n + " attachments"} will be deleted too.` : "This can't be undone.",
    action: `Delete ${type}`
  });
  if (!ok) return;
  try { await store.remove(it); toast(`${cap(type)} deleted`); } catch {}
}

/* ===================== Viewer ===================== */
async function openViewer(a) {
  let u = attUrl(a);
  if (!u && a.localId) u = await localUrl(a.localId);
  if (!u) return toast("This file isn't available on this device.", true);
  const L = makeLayer("viewer");
  L.innerHTML = (a.kind === "video"
    ? `<video src="${esc(u)}" controls autoplay playsinline></video>`
    : `<img src="${esc(u)}" alt="${esc(a.name || "")}">`) + `<button class="close" aria-label="Close">${I.x}</button>`;
  const close = () => { const v = $("video", L); if (v) v.pause(); L.close(); };
  L.onEscape = close;
  L.addEventListener("click", e => { if (e.target.tagName !== "VIDEO") close(); });
}

/* ===================== Add / edit form ===================== */
function openForm(type, existing, presetDate) {
  const isEdit = !!existing;
  const tk = todayKey();
  const isTodo = type === "todo", hasWork = type !== "event", tName = typeName({ type });
  const f = existing ? JSON.parse(JSON.stringify(existing)) : Object.assign({
    id: newId(), type, title: "", color: DEFAULT_COLOR[type],
    description: "", instructions: "", assigned: presetDate && presetDate < tk ? presetDate : tk,
    attachments: [], done: false, createdAt: Date.now()
  }, isTodo ? { urgency: 0, rise: true, urgencyStart: Date.now() } : { due: presetDate || tk }, hasWork ? { difficulty: 5, team: false, members: "" } : {});
  f.attachments ||= [];
  if (existing && isTodo) f.urgency = urgencyOf(existing);   // show the level it has reached
  let urgTouched = false;
  const dateKeys = isTodo ? ["assigned"] : ["assigned", "due"];
  const original = JSON.stringify(f);
  const added = [];     // uploaded during this edit (cleaned up on discard)
  const removed = [];   // removed during this edit (deleted on save)
  let pending = 0;

  const L = makeLayer("form");
  L.innerHTML = `<div class="backdrop"></div>
    <div class="sheet page" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <header class="nav">
        <button class="nav-btn" data-a="cancel">Cancel</button>
        <h2 id="formTitle">${isEdit ? "Edit" : "New"} ${tName}</h2>
        <button class="nav-btn strong" data-a="save" disabled>${isEdit ? "Save" : "Add"}</button>
      </header>
      <div class="sheet-scroll">
        <div class="group" style="margin-top:8px">
          <div class="cell"><input class="title-in" data-f="title" placeholder="Title" maxlength="120" aria-label="Title" autocomplete="off"></div>
          <div class="cell colors" role="radiogroup" aria-label="Color">${COLORS.map(([n, c]) =>
            `<button class="swatch" role="radio" aria-label="${n}" aria-checked="${c === f.color}" data-color="${c}" style="--c:${c}"></button>`).join("")}</div>
        </div>
        ${isTodo ? `<h3 class="group-h">Urgency</h3>
        <div class="group">
          <div class="cell"><div class="seg" role="radiogroup" aria-label="Urgency">${URG.map((u, i) =>
            `<button role="radio" aria-checked="${i === f.urgency}" data-urg="${i}">${u.name}</button>`).join("")}</div></div>
          <div class="cell kv-row"><span id="lblRise">Rise over time</span><button class="switch" role="switch" aria-checked="${f.rise !== false}" aria-labelledby="lblRise" data-rise></button></div>
        </div>
        <p class="group-foot" id="riseNote"></p>` : ""}
        <h3 class="group-h">Dates</h3>
        <div class="group">
          <div class="cell kv-row"><span id="lblAssigned">Assigned</span><button class="date-btn" data-dbtn="assigned" aria-expanded="false" aria-describedby="lblAssigned"></button></div>
          <div class="dp" data-dp="assigned"><div class="dp-inner"></div></div>
          ${isTodo ? "" : `<div class="cell kv-row"><span id="lblDue">Due</span><button class="date-btn" data-dbtn="due" aria-expanded="false" aria-describedby="lblDue"></button></div>
          <div class="dp" data-dp="due"><div class="dp-inner"></div></div>`}
        </div>
        <p class="group-foot warn" id="dateWarn" hidden>The due date is before the assigned date.</p>
        ${hasWork ? `<h3 class="group-h">Difficulty</h3>
        <div class="group"><div class="cell">
          <input type="range" class="slider" min="1" max="10" step="1" data-diff aria-label="Difficulty, 1 is easy and 10 is very hard">
          <output class="diff-val" id="diffVal" for="diff"></output></div></div>
        <p class="group-foot">1 is easy, 10 is very hard.</p>
        <h3 class="group-h">Work</h3>
        <div class="group">
          <div class="cell"><div class="seg" role="radiogroup" aria-label="Work type">
            <button role="radio" aria-checked="${!f.team}" data-team="0">Solo</button>
            <button role="radio" aria-checked="${!!f.team}" data-team="1">Team</button></div></div>
          <div class="dp team-panel${f.team ? " open" : ""}" data-team-panel><div class="dp-inner">
            <textarea class="members" data-f="members" rows="2" aria-label="Team members" placeholder="Names, separated by commas"></textarea></div></div>
        </div>` : ""}
        <h3 class="group-h">Description</h3>
        <div class="group"><div class="cell"><textarea data-f="description" rows="3" aria-label="Description" placeholder="${isTodo ? "What needs doing?" : type === "task" ? "What's this task about?" : "What's happening?"}"></textarea></div></div>
        ${type === "task" || isTodo ? `<h3 class="group-h">Instructions</h3>
        <div class="group"><div class="cell"><textarea data-f="instructions" rows="4" aria-label="Instructions" placeholder="Steps, page numbers, or what your teacher said"></textarea></div></div>` : ""}
        <h3 class="group-h">Attachments</h3>
        <div class="group">
          <div class="att-list"></div>
          <label class="cell row-btn">${I.photo}<span>Add photo or video</span><input type="file" class="sr" accept="image/*,video/*" multiple data-pick></label>
          <label class="cell row-btn">${I.pdf}<span>Add PDF</span><input type="file" class="sr" accept="application/pdf,.pdf" multiple data-pick></label>
          <button class="cell row-btn" data-a="link">${I.link}<span>Add link</span></button>
          <div class="cell link-row" hidden><input type="url" inputmode="url" placeholder="Paste a link" aria-label="Link" autocomplete="off"><button data-a="addlink">Add</button></div>
        </div>
        <p class="group-foot">Photos, videos and PDFs can be up to 20 MB each.</p>
      </div>
    </div>`;

  const q = s => $(s, L);
  const saveBtn = q("[data-a=save]");
  for (const k of ["title", "assigned", "due", "description", "instructions", "members"]) {
    const el = q(`[data-f=${k}]`);
    if (!el) continue;
    el.value = f[k] || "";
    el.addEventListener("input", () => { f[k] = el.value; validate(); });
  }

  if (hasWork) {
    const sl = q("[data-diff]"), out = q("#diffVal");
    const paint = () => {
      sl.style.setProperty("--p", ((sl.value - 1) / 9 * 100) + "%");
      out.textContent = f.difficulty != null ? String(f.difficulty) : "Not set";
      out.classList.toggle("unset", f.difficulty == null);
    };
    sl.value = f.difficulty != null ? f.difficulty : 5;
    sl.addEventListener("input", () => { f.difficulty = Number(sl.value); paint(); validate(); });
    paint();
  }

  /* Inline date picker (Gregorian, independent of the device's calendar setting) */
  const dpView = {};
  let dpOpen = null;
  function dateLabels() {
    for (const k of dateKeys) {
      const b = q(`[data-dbtn=${k}]`);
      b.textContent = f[k] ? fmt(f[k], { weekday: "short", month: "short", day: "numeric", year: "numeric" }) : "Choose date";
      b.classList.toggle("active", dpOpen === k);
      b.setAttribute("aria-expanded", dpOpen === k);
    }
  }
  function renderPicker(k) {
    const box = q(`[data-dp=${k}] .dp-inner`);
    const base = f[k] ? fromKey(f[k]) : new Date();
    const v = dpView[k] ||= { y: base.getFullYear(), m: base.getMonth() };
    const first = new Date(v.y, v.m, 1);
    const days = new Date(v.y, v.m + 1, 0).getDate();
    const tk = todayKey();
    let cells = "";
    for (let i = 0; i < first.getDay(); i++) cells += "<span></span>";
    for (let d = 1; d <= days; d++) {
      const key = `${v.y}-${pad(v.m + 1)}-${pad(d)}`;
      cells += `<button class="dp-day${key === f[k] ? " sel" : ""}${key === tk ? " today" : ""}" data-dday="${key}" aria-label="${esc(fmt(key, { weekday: "long", month: "long", day: "numeric", year: "numeric" }))}"${key === f[k] ? ' aria-current="date"' : ""}>${d}</button>`;
    }
    box.innerHTML = `<div class="dp-head"><span class="dp-title">${esc(first.toLocaleDateString(LOC, { month: "long" }))} ${v.y}</span>
      <button class="icon-btn" data-dnav="-1" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon-btn" data-dnav="1" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
      <div class="dp-wk" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
      <div class="dp-grid">${cells}</div>`;
  }
  function togglePicker(k) {
    dpOpen = dpOpen === k ? null : k;
    for (const key of dateKeys) {
      if (dpOpen === key) { delete dpView[key]; renderPicker(key); }
      q(`[data-dp=${key}]`).classList.toggle("open", dpOpen === key);
    }
    dateLabels();
  }
  dateLabels();
  function riseText() {
    const n = q("#riseNote"); if (!n) return;
    n.textContent = f.rise === false ? "Stays at the level you choose." : `Goes up one level every ${RISE_DAYS} days, until it reaches High.`;
  }
  riseText();

  function validate() {
    q("#dateWarn").hidden = !(f.assigned && f.due && f.due < f.assigned);
    saveBtn.disabled = !f.title.trim() || (!isTodo && !f.due) || pending > 0;
  }

  function renderAtts() {
    const list = q(".att-list");
    list.innerHTML = f.attachments.map(a => {
      const u = attUrl(a);
      let thumb;
      if (a.status === "uploading") thumb = `<span class="thumb"><span class="spin"></span></span>`;
      else if (a.kind === "image" && (u || a.localId)) thumb = `<img class="thumb" ${u ? `src="${esc(u)}"` : `data-local="${esc(a.localId)}"`} alt="">`;
      else thumb = `<span class="thumb">${I[a.kind === "image" ? "photo" : a.kind] || I.pdf}</span>`;
      const kindLabel = a.status === "uploading" ? "Uploading…" : ({ image: "Photo", video: "Video", pdf: "PDF", link: "Link" })[a.kind];
      return `<div class="cell att" data-att="${esc(a.id)}">${thumb}
        <div class="meta"><div class="name">${esc(a.name)}</div><div class="kind">${kindLabel}</div></div>
        ${a.status === "uploading" ? "" : `<button class="rm" data-rm aria-label="Remove ${esc(a.name)}">${I.minus}</button>`}</div>`;
    }).join("");
    hydrate(list);
  }

  async function addFiles(files) {
    for (const file of files) {
      const kind = file.type.startsWith("image/") ? "image" : file.type.startsWith("video/") ? "video"
        : (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) ? "pdf" : null;
      if (!kind) { toast("Choose a photo, video or PDF.", true); continue; }
      if (file.size > MAX_BYTES) { toast(`${file.name} is over 20 MB. Choose a smaller file.`, true); continue; }
      const a = { id: newId(), kind, name: file.name || cap(kind), status: "uploading" };
      f.attachments.push(a); pending++; renderAtts(); validate();
      try {
        Object.assign(a, await store.upload(file));
        delete a.status;
        added.push(a);
      } catch (e) {
        console.warn(e);
        f.attachments = f.attachments.filter(x => x !== a);
        toast(`Couldn't add ${file.name}. Try again.`, true);
      }
      pending--; renderAtts(); validate();
    }
  }

  function addLink() {
    const inp = q(".link-row input");
    let v = inp.value.trim();
    if (!v) return;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://" + v;
    let u;
    try { u = new URL(v); } catch {}
    if (!u || !/^https?:$/.test(u.protocol) || !u.hostname.includes(".")) { toast("Enter a web address, like example.com", true); return; }
    f.attachments.push({ id: newId(), kind: "link", url: u.href, name: u.hostname.replace(/^www\./, "") + (u.pathname.length > 1 ? u.pathname : "") });
    inp.value = "";
    renderAtts(); validate();
  }

  async function cancel() {
    if (pending) { toast("Wait for uploads to finish.", true); return; }
    if (JSON.stringify(f) !== original) {
      const ok = await actionSheet({ title: isEdit ? "Discard your changes?" : `Discard this ${tName}?`, action: "Discard changes" });
      if (!ok) return;
    }
    added.forEach(a => store.dropFile(a));
    L.close();
  }

  async function save() {
    if (saveBtn.disabled) return;
    f.title = f.title.trim();
    f.updatedAt = Date.now();
    if (isTodo) {
      if (isEdit && !urgTouched) { f.urgency = existing.urgency; f.rise = existing.rise; f.urgencyStart = existing.urgencyStart; }
      else f.urgencyStart = Date.now();                      // the clock restarts from the level you picked
    }
    saveBtn.disabled = true;
    try {
      await store.put(f);
      removed.forEach(a => store.dropFile(a));
      L.close();
      toast(`${cap(tName)} ${isEdit ? "saved" : "added"}`);
      if (!isEdit && daySheet && daySheet.key !== f.due) { /* keep sheet; item will show under its due day */ }
      if (!isEdit && !daySheet && f.due) { const d = fromKey(f.due); if (d.getFullYear() !== S.y || d.getMonth() !== S.m) { S.y = d.getFullYear(); S.m = d.getMonth(); renderCalendar(); } }
    } catch { validate(); }
  }

  L.onEscape = cancel;
  L.addEventListener("click", e => {
    if (e.target.classList.contains("backdrop")) return cancel();
    const db = e.target.closest("[data-dbtn]");
    if (db) return togglePicker(db.dataset.dbtn);
    const dn = e.target.closest("[data-dnav]");
    if (dn) {
      const k = dn.closest("[data-dp]").dataset.dp, v = dpView[k];
      const d = new Date(v.y, v.m + Number(dn.dataset.dnav), 1);
      v.y = d.getFullYear(); v.m = d.getMonth(); renderPicker(k); return;
    }
    const dd = e.target.closest("[data-dday]");
    if (dd) {
      const k = dd.closest("[data-dp]").dataset.dp;
      f[k] = dd.dataset.dday; renderPicker(k);
      setTimeout(() => togglePicker(k), reduced ? 0 : 160);
      validate(); return;
    }
    const tm = e.target.closest("[data-team]");
    if (tm) {
      f.team = tm.dataset.team === "1";
      L.querySelectorAll("[data-team]").forEach(b => b.setAttribute("aria-checked", b === tm));
      q("[data-team-panel]").classList.toggle("open", f.team);
      if (f.team) setTimeout(() => q("[data-f=members]").focus({ preventScroll: true }), 380);
      return;
    }
    const ug = e.target.closest("[data-urg]");
    if (ug) { f.urgency = Number(ug.dataset.urg); urgTouched = true; L.querySelectorAll("[data-urg]").forEach(b => b.setAttribute("aria-checked", b === ug)); return; }
    const rs = e.target.closest("[data-rise]");
    if (rs) { f.rise = !(f.rise !== false); urgTouched = true; rs.setAttribute("aria-checked", f.rise); riseText(); return; }
    const sw = e.target.closest("[data-color]");
    if (sw) { f.color = sw.dataset.color; L.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-checked", s === sw)); return; }
    const rm = e.target.closest("[data-rm]");
    if (rm) {
      const id = rm.closest("[data-att]").dataset.att;
      const a = f.attachments.find(x => x.id === id);
      f.attachments = f.attachments.filter(x => x.id !== id);
      if (a && a.kind !== "link") (added.includes(a) ? store.dropFile(a) : removed.push(a));
      renderAtts(); validate(); return;
    }
    const act = e.target.closest("[data-a]");
    if (!act) return;
    const a = act.dataset.a;
    if (a === "cancel") cancel();
    else if (a === "save") save();
    else if (a === "link") { const r = q(".link-row"); r.hidden = false; q(".link-row input").focus(); }
    else if (a === "addlink") addLink();
  });
  L.addEventListener("change", e => {
    if (e.target.matches("[data-pick]")) { const files = [...e.target.files]; e.target.value = ""; addFiles(files); }
  });
  q(".link-row input").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addLink(); } });
  q("[data-f=title]").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); save(); } });

  renderAtts(); validate();
  if (!isEdit) setTimeout(() => q("[data-f=title]").focus({ preventScroll: true }), 420);
}

/* ===================== Home wiring ===================== */
$("#todayLine").textContent = new Date().toLocaleDateString(LOC, { weekday: "long", month: "long", day: "numeric" });
$("#prevBtn").onclick = () => shiftMonth(-1);
$("#nextBtn").onclick = () => shiftMonth(1);
$("#todayBtn").onclick = () => { const n = new Date(); shiftMonth((n.getFullYear() - S.y) * 12 + n.getMonth() - S.m); };
$("#todoBtn").onclick = openTodo;
$("#acctBtn").onclick = openAccount;
$("#foot").addEventListener("click", e => { if (e.target.closest("[data-open-acct]")) openAccount(); });
document.querySelector(".actions").addEventListener("click", e => { const b = e.target.closest("[data-add]"); if (b) openForm(b.dataset.add, null, null); });

// Tap a day. Swipe the calendar left or right to change month; the grid follows your finger.
(() => {
  const g = $("#grid"), cal = $(".cal");
  let sx = null, sy = 0, dx = 0, axis = null, t0 = 0, swiped = false;
  const start = (x, y) => { if (monthAnimating) return; sx = x; sy = y; dx = 0; axis = null; t0 = performance.now(); swiped = false; };
  const move = (x, y, e) => {
    if (sx == null) return;
    const mx = x - sx, my = y - sy;
    if (!axis) {
      if (Math.hypot(mx, my) < 8) return;
      axis = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (axis === "x") g.style.transition = "none";
    }
    if (axis !== "x") return;
    if (e.cancelable) e.preventDefault();
    dx = mx;
    g.style.transform = `translateX(${dx}px)`;
    g.style.opacity = String(1 - Math.min(Math.abs(dx) / (g.offsetWidth * 1.4), 0.5));
  };
  const end = () => {
    if (sx == null) return;
    sx = null;
    if (axis !== "x") return;
    swiped = true;
    const w = g.offsetWidth, v = Math.abs(dx) / Math.max(1, performance.now() - t0);
    if (Math.abs(dx) > w * 0.2 || (v > 0.4 && Math.abs(dx) > 24)) {
      if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
      shiftMonth(dx < 0 ? 1 : -1, dx);
    } else {
      g.style.transition = "transform .4s var(--spring), opacity .3s";
      g.style.transform = ""; g.style.opacity = "";
    }
  };
  // Touch (phones, tablets)
  cal.addEventListener("touchstart", e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY); else sx = null; }, { passive: true });
  cal.addEventListener("touchmove", e => { if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive: false });
  cal.addEventListener("touchend", end);
  cal.addEventListener("touchcancel", end);
  // Mouse / trackpad drag (computers)
  cal.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" && e.button === 0) start(e.clientX, e.clientY); });
  addEventListener("pointermove", e => { if (e.pointerType === "mouse") move(e.clientX, e.clientY, e); });
  addEventListener("pointerup", e => { if (e.pointerType === "mouse") end(); });
  // Arrow keys also change month when the calendar has focus
  cal.addEventListener("keydown", e => {
    if (e.key === "PageUp") { e.preventDefault(); shiftMonth(-1); }
    if (e.key === "PageDown") { e.preventDefault(); shiftMonth(1); }
  });
  g.addEventListener("click", e => {
    if (swiped) { swiped = false; return; }
    const d = e.target.closest(".day");
    if (d) openDay(d.dataset.date);
  });
})();

let rw; addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => renderCalendar(), 150); });

renderCalendar();
boot();
})();
