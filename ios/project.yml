# Generates HomeworkNote.xcodeproj with XcodeGen. See README.md in this folder.
name: HomeworkNote
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # >>> Change "example" to something unique to you (letters only), for example com.kenlobster.homeworknote
    APP_BUNDLE_ID: com.example.homeworknote
    APP_GROUP: group.$(APP_BUNDLE_ID)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  HomeworkNote:
    type: application
    platform: iOS
    sources:
      - path: HomeworkNote
      - path: ../index.html
        buildPhase: resources
      - path: ../firebase-config.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HomeworkNote/Info.plist
      properties:
        CFBundleDisplayName: Homework Note
        HNAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Attach photos and videos to your homework items.
        NSCameraUsageDescription: Take a photo or video to attach to your homework items.
        NSMicrophoneUsageDescription: Record sound when you film a video to attach to an item.
    entitlements:
      path: HomeworkNote/HomeworkNote.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: HomeworkNoteWidget
  HomeworkNoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HomeworkNoteWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        SKIP_INSTALL: YES
    info:
      path: HomeworkNoteWidget/Info.plist
      properties:
        CFBundleDisplayName: Homework Note
        HNAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HomeworkNoteWidget/HomeworkNoteWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
